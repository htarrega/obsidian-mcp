# Installed to /etc/fail2ban/filter.d/obsidian-caddy-oauth.conf by
# deploy/provision.sh. Matches requests to the unauthenticated OAuth endpoints
# in Caddy's JSON access log (/var/log/caddy/obsidian-mcp-access.log). One
# line per request; the jails pick the method and path:
#
#   filter = obsidian-caddy-oauth[oauth_method=POST, oauth_path=/register]
#
# Caddy logs `"request":{"remote_ip":"…","remote_port":"…","client_ip":"…",
# "proto":"…","method":"…","host":"…","uri":"…","headers":{…}}`. `[^{}]*`
# keeps every match inside the request object (before the headers), so a
# client cannot spoof the method/uri through a header value, and the scan
# stays linear. remote_ip is the TCP peer: Caddy is directly exposed (DNS
# only, no proxy in front), so it is the real client address.

[Definition]

oauth_method = POST
oauth_path = /register

failregex = "request":\{"remote_ip":"<HOST>",[^{}]*"method":"<oauth_method>",[^{}]*"uri":"<oauth_path>(?:\?[^"]*)?"

ignoreregex =

# Caddy's JSON "ts" is a Unix timestamp with fractional seconds.
datepattern = "ts":{EPOCH}
