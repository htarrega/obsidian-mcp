# Installed to /etc/ssh/sshd_config.d/00-obsidian-hardening.conf by
# deploy/provision.sh.
#
# The "00-" prefix matters: sshd uses the FIRST value it reads for each
# keyword, and Ubuntu cloud images ship 50-cloud-init.conf which may set
# `PasswordAuthentication yes`. Files in sshd_config.d are read in lexical
# order, so this one must sort first.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
# Oracle images log in as `ubuntu` and use sudo; root never needs SSH.
PermitRootLogin no
X11Forwarding no
MaxAuthTries 4
LoginGraceTime 30
