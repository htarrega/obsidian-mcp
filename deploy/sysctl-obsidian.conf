# Installed to /etc/sysctl.d/60-obsidian.conf by deploy/provision.sh.
#
# Both ob (Obsidian Headless, Node) and the MCP server's watchdog use one
# inotify watch per directory of the vault. Ubuntu's defaults (watches scale
# with RAM; instances=128) run out on large vaults, which silently degrades to
# missed changes or ENOSPC errors.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512
